# Sonatype Guide — Agentic Patches (AGP) configuration
# Learn more: https://links.sonatype.com/products/guide/docs/agent-p

version: '1'
pr:
  autoCloseFailedPrs: true
  create: true
  recreateAfterClose: false
dryRun: false
securityOnly: false
automerge:
  enabled: false
validation:
  enabled: false
limits:
  maxOpenPRs: 100
  maxPRsPerRun: 100
